<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-section {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin: 15px 0;
      max-height: 200px;
      overflow-y: auto;
    }

    .preview-tab {
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
      font-size: 12px;
    }

    .preview-tab:last-child {
      border-bottom: none;
    }

    .tab-title {
      font-weight: 500;
      color: #333;
    }

    .tab-url {
      color: #666;
      margin-top: 2px;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-close {
      background: #d73a49;
      color: white;
    }

    .btn-close:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .count {
      font-weight: bold;
      color: #d73a49;
    }

    .no-matches {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="pattern">Pattern to match:</label>
    <input type="text" id="pattern" placeholder="e.g., reddit.com or Stack Overflow">
  </div>

  <div class="form-group">
    <label for="matchType">Match in:</label>
    <select id="matchType">
      <option value="url">URL</option>
      <option value="title">Title</option>
      <option value="both">URL or Title</option>
    </select>
  </div>

  <div class="form-group">
    <div class="checkbox-group">
      <input type="checkbox" id="caseSensitive">
      <label for="caseSensitive">Case sensitive</label>
    </div>
  </div>

  <div class="form-group">
    <div class="checkbox-group">
      <input type="checkbox" id="useRegex">
      <label for="useRegex">Use regex pattern</label>
    </div>
  </div>

  <div class="button-group">
    <button id="closeBtn" class="btn-close" disabled>Close Tabs</button>
  </div>

  <div id="preview" class="preview-section" style="display: none;">
    <div id="previewContent"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
